[package]
name = "rbx-questionnaire"
version = "0.2.2"
edition = "2021"
# Set by a dependency, not by our code, and bisected against real toolchains
# rather than read off the manifests: 1.87 fails, 1.88 passes. It comes from the
# `icu_*` crates, which arrive through `idna` and `url` under `reqwest`, so this
# number moves when TLS and URL parsing move rather than when anything here
# does. The `msrv` CI job is what stops it moving silently.
rust-version = "1.88"
license = "MPL-2.0"
description = "Declare, review and submit a Roblox experience's content questionnaire"
repository = "https://github.com/rbx-forge/rbx-questionnaire"
homepage = "https://github.com/rbx-forge/rbx-questionnaire"
authors = ["rbx-forge"]
keywords = ["roblox", "questionnaire", "age-rating", "cli"]
categories = ["command-line-utilities", "game-development"]
readme = "README.md"
# crates.io refuses a crate with a git dependency, and this one has one. The
# binary ships through GitHub releases.
publish = false

[lib]
name = "rbx_questionnaire"
path = "src/lib.rs"

[[bin]]
name = "rbx-questionnaire"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `toml_edit` and not `toml`, because the config is a file a person writes and
# keeps: pulling a newly added question into it must not reformat their file or
# drop the comment they left next to an answer.
toml_edit = { version = "0.22", features = ["serde"] }
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# TLS is rustls rather than the platform default so a published Linux binary
# does not need the exact libssl the build runner had.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "gzip",
    "charset",
    "http2",
    "rustls-tls-native-roots",
] }
# The library the rbx-forge tools share, for one thing here: the cookie chain,
# so a signed-in Studio is used only after the same yes every other tool asks
# for, with the same notice.
rbx-core = { git = "https://github.com/rbx-forge/rbx-core", tag = "v0.1.1" }
dialoguer = "0.11"

[dev-dependencies]
tempfile = "3"

# Release profile tuned for a distributed CLI binary. Slower to compile, but
# the binary is smaller and starts faster.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
# Default-on lints stay at their default level. Restriction-group lints like
# `unwrap_used` are deliberately not enabled: too much noise on patterns that
# are correct by construction.
todo = "warn"
dbg_macro = "warn"
print_stdout = "allow"   # CLI tool, println! is intentional
print_stderr = "allow"
